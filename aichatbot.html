
<link rel="stylesheet" href="aichatbot.css"
<div class="chat-widget">
    <div id="chat-window" class="chat-window">
        <div class="chat-header">
            <div class="chat-header-info">
                <i class="fas fa-robot"></i>
                <div>
                    <h4>Pancivil Assistant</h4>
                    <span class="status-indicator">Online</span>
                </div>
            </div>
            <button id="chat-close-btn" class="chat-close-btn" aria-label="Minimize Chat">&times;</button>
        </div>

        <div id="chat-body" class="chat-body">
            <div class="chat-message bot">
                Hello! Welcome to Pancivil Landscapers. How can I help transform your outdoor space today?
            </div>
        </div>

        <div class="chat-quick-actions">
            <button onclick="sendQuickReply('Get a Quote')">Get Quote</button>
            <button onclick="sendQuickReply('Lawn Maintenance')">Lawn Care</button>
            <button onclick="sendQuickReply('Hardscaping Options')">Hardscaping</button>
        </div>

        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
            <button id="chat-send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>
<script src="aichatbot.js"></script>
